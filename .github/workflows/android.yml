name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
  pull_request:
    paths: ['apps/gridcraft-android/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      # The host test also builds the shared assistant's desktop side (windowing, clipboard).
      - name: Linux build dependencies
        uses: storytold/craft-common-actions/actions/install-linux-deps@main
      - run: cargo test --locked -p gridcraft-android
      - run: cargo clippy --locked -p gridcraft-android --target aarch64-linux-android -- -D warnings
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CXXFLAGS_aarch64_linux_android: -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=1
      - run: ./apps/gridcraft-android/build-apk.sh
        env:
          CRAFT_ANDROID_VARIANT: release
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
        working-directory: apps/gridcraft-android/android
      - uses: actions/upload-artifact@v4
        with:
          name: gridcraft-android-arm64-unsigned
          path: apps/gridcraft-android/android/app/build/outputs/apk/release/app-release*.apk
