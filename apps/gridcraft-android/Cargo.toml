[package]
name = "gridcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Android tablet host for GridCraft"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "android-game-activity", "default_fonts"] }
android-activity = { version = "0.6.1", features = ["game-activity"] }
jni = "0.22.4"
zeroize = { version = "1", features = ["derive"] }
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
